services:
  gateway:
    image: ${PI_INTERNAL_IMAGE:?task-specific built image required}
    command: ["node", "/app/internal-agent/gateway.mjs", "/etc/pi-internal/gateway.json", "/run/pi-internal/gateway.sock"]
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777"]
    env_file:
      - path: ${PI_INTERNAL_GATEWAY_ENV_FILE:?private gateway env file required}
        required: true
        format: raw
    volumes:
      - type: volume
        source: gateway_socket
        target: /run/pi-internal
      - type: bind
        source: ${PI_INTERNAL_GATEWAY_CONFIG_FILE:?gateway config file required}
        target: /etc/pi-internal/gateway.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PI_INTERNAL_CA_FILE:?CA file required}
        target: /etc/pi-internal/ca.pem
        read_only: true
        bind: {create_host_path: false}
    networks: [upstream]

  agent:
    image: ${PI_INTERNAL_IMAGE:?task-specific built image required}
    command: ["node", "/app/internal-agent/agent-daemon.mjs"]
    depends_on: [gateway]
    user: "1000:1000"
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777"]
    environment:
      HOME: /var/lib/pi-mcp/home
    volumes:
      - type: volume
        source: workspace
        target: /workspace
      - type: volume
        source: state
        target: /var/lib/pi-mcp
      - type: volume
        source: gateway_socket
        target: /run/pi-internal
        read_only: true
      - type: bind
        source: ${PI_INTERNAL_CONFIG_FILE:?agent config file required}
        target: /etc/pi-internal/config.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PI_INTERNAL_MODELS_FILE:?models file required}
        target: /etc/pi-internal/models.json
        read_only: true
        bind: {create_host_path: false}

volumes:
  workspace:
  state:
  gateway_socket:

networks:
  upstream:
    external: true
    name: ${PI_INTERNAL_UPSTREAM_NETWORK:?dedicated gateway upstream network required}
